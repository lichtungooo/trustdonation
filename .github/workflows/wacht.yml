# Sieht von aussen nach, ob trustdonation erreichbar ist.
#
# Von aussen ist besser als vom Server: Eine Pruefung, die auf demselben
# Rechner laeuft, schweigt genau dann, wenn der Rechner weg ist.
#
# Faellt etwas aus, oeffnet der Lauf ein Issue. Ist es wieder da, schliesst
# er es. So gibt es eine Meldung je Stoerung, nicht alle zehn Minuten eine.
name: Wacht

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  erreichbar:
    runs-on: ubuntu-latest
    steps:
      - name: Seiten abfragen
        id: pruefen
        run: |
          fehler=""
          for ziel in "https://trustdonation.org/" "https://trustdonation.org/app/"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$ziel" || echo "000")
            if [ "$code" != "200" ]; then
              fehler="${fehler}${ziel} antwortet ${code}. "
            fi
          done
          # Die App muss ihre Konfiguration ausliefern, sonst startet sie nicht.
          conf=$(curl -s --max-time 20 "https://trustdonation.org/app/config.json" || echo "")
          case "$conf" in
            *endpoints*) ;;
            *) fehler="${fehler}config.json fehlt oder ist unvollstaendig. " ;;
          esac
          if [ -n "$fehler" ]; then
            echo "fehler=$fehler" >> "$GITHUB_OUTPUT"
            echo "$fehler"
            exit 1
          fi
          echo "fehler=" >> "$GITHUB_OUTPUT"
          echo "Alles erreichbar."

      - name: Stoerung melden
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titel = "Wacht: trustdonation.org gestoert"
            const offen = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "wacht",
            })
            const text = `Die Wacht hat um ${new Date().toISOString()} eine Stoerung gefunden.\n\n`
              + `Lauf: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n`
              + `Erste Schritte: Container ansehen (\`docker ps --filter name=rls-app-wir\`), `
              + `dann \`docker compose up -d\` in \`~/apps/wir-ooo\`. `
              + `Zurueckdrehen ueber \`RLS_IMAGE_TAG\`, siehe docs/09-betrieb.md.`
            if (offen.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: titel, body: text, labels: ["wacht"],
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: offen.data[0].number, body: text,
              })
            }

      - name: Entwarnung
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const offen = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "wacht",
            })
            for (const issue of offen.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `Wieder erreichbar um ${new Date().toISOString()}.`,
              })
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: "closed",
              })
            }
