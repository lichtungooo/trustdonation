# trustdonation — Instanz auf Timos NixOS-Server.
#
# Zwei Domains auf demselben Container: die Zieldomain aus RLS_DOMAIN und
# die Baustelle aus RLS_DOMAIN_ALT (Standard wir.ooo). Traefik holt fuer
# beide ein Zertifikat, sobald ihr DNS auf diesen Server zeigt.
# Schwester der reallife.network-Instanz in ~/apps/rls-app/.
#
# Alle Namen sind auf -wir gesetzt, damit die beiden Instanzen sich nicht
# in die Quere kommen (Container-Namen, Traefik-Router).
#
# Start:  docker compose up -d      (Konfiguration in .env)

services:
  app:
    image: ghcr.io/real-life-org/rls-app:${RLS_IMAGE_TAG:?RLS_IMAGE_TAG fehlt - welche Version soll laufen?}
    container_name: rls-app-wir
    network_mode: bridge
    restart: unless-stopped
    environment:
      # --- Dienste ---
      RLS_RELAY_URL: ${RLS_RELAY_URL:-wss://relay.web-of-trust.de}
      RLS_PROFILES_URL: ${RLS_PROFILES_URL:-}
      RLS_DEFAULT_CONNECTOR: ${RLS_DEFAULT_CONNECTOR:-wot}
      RLS_SUPABASE_URL: ${RLS_SUPABASE_URL:-}
      RLS_SUPABASE_ANON_KEY: ${RLS_SUPABASE_ANON_KEY:-}
      # --- Identitaet ---
      RLS_APP_NAME: ${RLS_APP_NAME:?RLS_APP_NAME fehlt - wie heisst diese Instanz?}
      RLS_FAVICON_URL: ${RLS_FAVICON_URL:-/branding/favicon.svg}
    volumes:
      - ./landing:/srv/landing:ro
      - ./branding:/srv/branding:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rls-app-wir.rule=Host(`${RLS_DOMAIN:?RLS_DOMAIN fehlt - unter welcher Domain laeuft die Instanz?}`) || Host(`${RLS_DOMAIN_ALT:-wir.ooo}`)"
      - "traefik.http.routers.rls-app-wir.entrypoints=websecure"
      - "traefik.http.routers.rls-app-wir.tls.certresolver=letsencrypt"
      - "traefik.http.services.rls-app-wir.loadbalancer.server.port=8080"
      - "com.centurylinklabs.watchtower.enable=false"
